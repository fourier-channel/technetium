<!doctype html>
<!-- boo.52: mounts the REAL MediaErrorCard for every status the media route can
     answer with, full (a 400px picture box) and compact (a 200px thumbnail
     box), plus no status at all. Served by the dev server:
     /tools/visual/mediaerror-react.html
     Reports, measured in the engine that loads it, whether each card fills its
     box exactly and whether any text runs outside it. Proves what the card
     draws; nothing against a live media gate. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html, body { margin: 0; background: var(--mod-page, #12110f); } #root { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; }</style>
</head>
<body>
<div id="root"></div>
<pre id="result" style="color:#ccc; padding: 0 12px; white-space: pre-wrap">running</pre>
<script type="module" src="./mediaerror-react.tsx"></script>
</body>
</html>
