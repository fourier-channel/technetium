<!doctype html><html><head>
<!--#head-->
<title>DM section -- shape</title>
<style>
  /* NavTree.tsx's Direct Messages section, mirrored: the container's line and
     radius, the header row's fixed height, the faces (DM_AVATAR = 30) with the
     strip's gap and padding. BEFORE uses the pill radius it had until
     2026-10-05; AFTER uses --tc-dm-radius from the live stylesheet. */
  .h-wrap { display: flex; gap: 18px; padding: 8px 16px 16px; align-items: flex-start; }
  .h-col { width: 250px; background: var(--cpd-color-bg-canvas-default); border: 1px solid var(--mod-line); padding: 4px 0; }
  .h-cap { font: 600 10px var(--tc-ui-font); opacity: .6; padding: 0 0 4px; }
  .h-dm { margin: 2px 4px 6px; border: 1px solid var(--tc-pill-line); }
  .h-head { display: flex; align-items: center; gap: 6px; width: 100%; box-sizing: border-box; height: var(--tc-dm-head-h); padding: 0 10px;
            border: none; background: transparent; color: var(--cpd-color-text-secondary); font-size: 11px; font-weight: 700;
            letter-spacing: .4px; text-transform: uppercase; }
  .h-filter { display: block; margin: 4px 0 0 10px; padding: 2px 9px; border-radius: 999px; border: 1px solid rgba(128,128,128,.35);
              background: transparent; color: var(--cpd-color-text-secondary); font-size: 10px; letter-spacing: .4px; text-transform: uppercase; }
  .h-body { display: flex; flex-wrap: wrap; align-items: center; gap: 13px; padding: 10px 12px 12px; }
  .h-face { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--tc-ui-font); color: #fff; }
</style>
</head><body>
<div class="h-label">BEFORE -- the pill radius: every state a stadium</div><div class="h-wrap"><div><div class="h-cap">collapsed</div><div class="h-col"><div class="h-dm" style="border-radius:var(--tc-pill-radius);background:transparent">
      <button type="button" class="h-head">&#9656; Direct Messages <span style="margin-left:auto;opacity:.7">3</span></button></div></div></div><div><div class="h-cap">open, 1 row</div><div class="h-col"><div class="h-dm" style="border-radius:var(--tc-pill-radius);background:var(--cpd-color-bg-subtle-secondary)">
      <button type="button" class="h-head">&#9662; Direct Messages <span style="margin-left:auto;opacity:.7">3</span></button><button type="button" class="h-filter">Recent</button><div class="h-body"><span class="h-face" style="background:hsl(0 45% 45%)">A</span><span class="h-face" style="background:hsl(47 45% 45%)">B</span><span class="h-face" style="background:hsl(94 45% 45%)">C</span></div></div></div></div><div><div class="h-cap">open, 2 rows</div><div class="h-col"><div class="h-dm" style="border-radius:var(--tc-pill-radius);background:var(--cpd-color-bg-subtle-secondary)">
      <button type="button" class="h-head">&#9662; Direct Messages <span style="margin-left:auto;opacity:.7">8</span></button><button type="button" class="h-filter">Recent</button><div class="h-body"><span class="h-face" style="background:hsl(0 45% 45%)">A</span><span class="h-face" style="background:hsl(47 45% 45%)">B</span><span class="h-face" style="background:hsl(94 45% 45%)">C</span><span class="h-face" style="background:hsl(141 45% 45%)">D</span><span class="h-face" style="background:hsl(188 45% 45%)">E</span><span class="h-face" style="background:hsl(235 45% 45%)">F</span><span class="h-face" style="background:hsl(282 45% 45%)">G</span><span class="h-face" style="background:hsl(329 45% 45%)">H</span></div></div></div></div><div><div class="h-cap">open, 3 rows</div><div class="h-col"><div class="h-dm" style="border-radius:var(--tc-pill-radius);background:var(--cpd-color-bg-subtle-secondary)">
      <button type="button" class="h-head">&#9662; Direct Messages <span style="margin-left:auto;opacity:.7">13</span></button><button type="button" class="h-filter">Recent</button><div class="h-body"><span class="h-face" style="background:hsl(0 45% 45%)">A</span><span class="h-face" style="background:hsl(47 45% 45%)">B</span><span class="h-face" style="background:hsl(94 45% 45%)">C</span><span class="h-face" style="background:hsl(141 45% 45%)">D</span><span class="h-face" style="background:hsl(188 45% 45%)">E</span><span class="h-face" style="background:hsl(235 45% 45%)">F</span><span class="h-face" style="background:hsl(282 45% 45%)">G</span><span class="h-face" style="background:hsl(329 45% 45%)">H</span><span class="h-face" style="background:hsl(16 45% 45%)">I</span><span class="h-face" style="background:hsl(63 45% 45%)">J</span><span class="h-face" style="background:hsl(110 45% 45%)">K</span><span class="h-face" style="background:hsl(157 45% 45%)">L</span><span class="h-face" style="background:hsl(204 45% 45%)">M</span></div></div></div></div></div>
<div class="h-label">AFTER -- half the collapsed height: a stadium shut, a rounded rectangle open</div><div class="h-wrap"><div><div class="h-cap">collapsed</div><div class="h-col"><div class="h-dm" style="border-radius:var(--tc-dm-radius);background:transparent">
      <button type="button" class="h-head">&#9656; Direct Messages <span style="margin-left:auto;opacity:.7">3</span></button></div></div></div><div><div class="h-cap">open, 1 row</div><div class="h-col"><div class="h-dm" style="border-radius:var(--tc-dm-radius);background:var(--cpd-color-bg-subtle-secondary)">
      <button type="button" class="h-head">&#9662; Direct Messages <span style="margin-left:auto;opacity:.7">3</span></button><button type="button" class="h-filter">Recent</button><div class="h-body"><span class="h-face" style="background:hsl(0 45% 45%)">A</span><span class="h-face" style="background:hsl(47 45% 45%)">B</span><span class="h-face" style="background:hsl(94 45% 45%)">C</span></div></div></div></div><div><div class="h-cap">open, 2 rows</div><div class="h-col"><div class="h-dm" style="border-radius:var(--tc-dm-radius);background:var(--cpd-color-bg-subtle-secondary)">
      <button type="button" class="h-head">&#9662; Direct Messages <span style="margin-left:auto;opacity:.7">8</span></button><button type="button" class="h-filter">Recent</button><div class="h-body"><span class="h-face" style="background:hsl(0 45% 45%)">A</span><span class="h-face" style="background:hsl(47 45% 45%)">B</span><span class="h-face" style="background:hsl(94 45% 45%)">C</span><span class="h-face" style="background:hsl(141 45% 45%)">D</span><span class="h-face" style="background:hsl(188 45% 45%)">E</span><span class="h-face" style="background:hsl(235 45% 45%)">F</span><span class="h-face" style="background:hsl(282 45% 45%)">G</span><span class="h-face" style="background:hsl(329 45% 45%)">H</span></div></div></div></div><div><div class="h-cap">open, 3 rows</div><div class="h-col"><div class="h-dm" style="border-radius:var(--tc-dm-radius);background:var(--cpd-color-bg-subtle-secondary)">
      <button type="button" class="h-head">&#9662; Direct Messages <span style="margin-left:auto;opacity:.7">13</span></button><button type="button" class="h-filter">Recent</button><div class="h-body"><span class="h-face" style="background:hsl(0 45% 45%)">A</span><span class="h-face" style="background:hsl(47 45% 45%)">B</span><span class="h-face" style="background:hsl(94 45% 45%)">C</span><span class="h-face" style="background:hsl(141 45% 45%)">D</span><span class="h-face" style="background:hsl(188 45% 45%)">E</span><span class="h-face" style="background:hsl(235 45% 45%)">F</span><span class="h-face" style="background:hsl(282 45% 45%)">G</span><span class="h-face" style="background:hsl(329 45% 45%)">H</span><span class="h-face" style="background:hsl(16 45% 45%)">I</span><span class="h-face" style="background:hsl(63 45% 45%)">J</span><span class="h-face" style="background:hsl(110 45% 45%)">K</span><span class="h-face" style="background:hsl(157 45% 45%)">L</span><span class="h-face" style="background:hsl(204 45% 45%)">M</span></div></div></div></div></div>
</body></html>
